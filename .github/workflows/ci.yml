name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e './backend[dev]'
      - run: python -m pip install -e './docker-sandbox[dev]'
      - run: python -m pytest -q --cov=app --cov-branch --cov-report=term-missing --cov-report=json:coverage.json
        working-directory: backend
      - run: python scripts/coverage_summary.py Backend backend/coverage.json --min-line 83 --min-branch 68
      - run: python -m pytest -q --cov=app --cov-branch --cov-report=term-missing --cov-report=json:coverage.json
        working-directory: docker-sandbox
      - run: python scripts/coverage_summary.py Sandbox docker-sandbox/coverage.json --min-line 88 --min-branch 80
      - run: python scripts/run_evaluation_scenarios.py --mode scripted --output data/evaluation-ci
      - run: npm ci
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm run lint && npm run build
        working-directory: frontend

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp backend.env.example backend.env
        working-directory: .
      - run: docker compose up --build -d
        working-directory: .
      - run: python scripts/docker_smoke.py
        working-directory: .
      - if: always()
        run: docker compose logs --no-color
        working-directory: .
      - if: always()
        run: docker compose down -v --remove-orphans
        working-directory: .
