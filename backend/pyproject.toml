[project]
name = "repropilot-backend"
version = "0.1.0"
description = "Python runtime for ReproPilot"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]
sandbox = ["docker>=7.1,<8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
