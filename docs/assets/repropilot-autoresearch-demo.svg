    <text x="667" y="225" class="tiny muted">BASELINE</text>
    <text x="1050" y="227" class="label">0.6667</text>
    <rect x="667" y="241" width="423" height="66" rx="8" fill="#f8eeee" stroke="#ead4d2"/>
    <circle cx="687" cy="263" r="7" fill="#a95c57"/>
    <text x="703" y="267" class="label">Trial 1 · Reject</text>
    <text x="687" y="290" class="tiny muted">Invalid structured status; rejected before file write</text>
    <rect x="667" y="319" width="423" height="96" rx="8" fill="#edf4ef" stroke="#cfded3"/>
    <circle cx="687" cy="342" r="7" class="check"/>
    <text x="703" y="346" class="label">Trial 2 · Keep</text>
    <text x="1059" y="346" class="label" fill="#537c62">1.0</text>
    <text x="687" y="370" class="tiny">Fix zero boundary: value &gt;= 0 → value &gt; 0</text>
    <text x="687" y="393" class="tiny muted">Samples [1.0, 1.0, 1.0] · SHA-256 recorded</text>
    <text x="667" y="447" class="tiny muted">qwen3-coder-plus · 2 requests · 2237 tokens</text>
    <rect x="667" y="465" width="423" height="25" rx="12" fill="#f0e2d8"/>
    <text x="801" y="482" class="tiny accent">target_score_reached</text>
  </g>

  <g id="phase3" opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;.60;.66;.66;.72;.94;1" dur="15s" repeatCount="indefinite"/>
    <rect class="panel" x="642" y="120" width="474" height="386" rx="12"/>
    <text x="667" y="153" class="tiny accent">VALIDATION REPORT</text>
    <text x="667" y="182" class="title">Hidden holdout</text>
    <rect x="1000" y="145" width="90" height="30" rx="15" fill="#e6efe8"/>
    <text x="1024" y="165" class="label" fill="#537c62">PASSED</text>
    <line x1="667" y1="198" x2="1090" y2="198" stroke="#e2d9d2"/>
    <text x="667" y="229" class="tiny muted">FRESH PROCESS SCORES</text>
    <g transform="translate(667 246)">
      <rect width="126" height="58" rx="8" fill="#edf4ef" stroke="#cfded3"/>
      <text x="14" y="23" class="tiny muted">RUN 1</text><text x="14" y="45" class="title" fill="#537c62">1.0</text>
      <rect x="144" width="126" height="58" rx="8" fill="#edf4ef" stroke="#cfded3"/>
      <text x="158" y="23" class="tiny muted">RUN 2</text><text x="158" y="45" class="title" fill="#537c62">1.0</text>
      <rect x="288" width="126" height="58" rx="8" fill="#edf4ef" stroke="#cfded3"/>
      <text x="302" y="23" class="tiny muted">RUN 3</text><text x="302" y="45" class="title" fill="#537c62">1.0</text>
    </g>
    <text x="667" y="337" class="label">✓ Candidate hash intact</text>
    <text x="667" y="365" class="label">✓ Protected evaluators intact</text>
    <text x="667" y="393" class="label">✓ Final validation called no candidate model</text>
    <text x="667" y="421" class="label">✓ Task containers remaining: 0</text>
    <rect x="667" y="452" width="423" height="37" rx="8" fill="#302821"/>
    <text x="768" y="476" class="small" fill="#fff">Evidence accepted by runtime</text>
  </g>

  <line x1="270" y1="548" x2="1117" y2="548" stroke="#ded7cf"/>
  <g transform="translate(292 574)">
    <circle cx="0" cy="0" r="12" fill="#b8683e"/><text x="-3.5" y="4" class="tiny" fill="#fff">1</text>
    <text x="20" y="5" class="label">Multi-agent DAG</text>
    <line x1="148" y1="0" x2="242" y2="0" stroke="#ded7cf"/>
    <circle cx="263" cy="0" r="12" fill="#b8683e"/><text x="259.5" y="4" class="tiny" fill="#fff">2</text>
    <text x="283" y="5" class="label">Governed trials</text>
    <line x1="407" y1="0" x2="501" y2="0" stroke="#ded7cf"/>
    <circle cx="522" cy="0" r="12" fill="#b8683e"/><text x="518.5" y="4" class="tiny" fill="#fff">3</text>
