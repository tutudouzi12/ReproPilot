<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">ReproPilot bounded AutoResearch walkthrough</title>
  <desc id="desc">Animated walkthrough of an eight-node multi-agent DAG, governed Keep Reject trials, and hidden holdout validation.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2f241d" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b7aca4"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #302821; }
      .muted { fill: #8b8179; }
      .tiny { font-size: 11px; }
      .small { font-size: 13px; }
      .label { font-size: 12px; font-weight: 650; }
      .title { font-size: 18px; font-weight: 700; }
      .node { fill: #fffdf9; stroke: #ddd4cd; stroke-width: 1; filter: url(#shadow); }
      .edge { fill: none; stroke: #b7aca4; stroke-width: 1.5; marker-end: url(#arrow); }
      .check { fill: #537c62; }
      .accent { fill: #b8683e; }
      .panel { fill: #fffdf9; stroke: #ddd4cd; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1200" height="675" fill="#f6f2eb"/>
  <rect x="0" y="0" width="1200" height="62" fill="#fbf8f2" stroke="#ded7cf"/>
  <rect x="0" y="62" width="244" height="613" fill="#fbf8f2" stroke="#ded7cf"/>

  <g transform="translate(22 20)">
    <path d="M0 10 8 2l8 8-8 8z M8 2l8-8 8 8-8 8z" fill="none" stroke="#b8683e" stroke-width="1.7" transform="translate(0 4) scale(.7)"/>
    <text x="29" y="20" font-size="17" font-weight="750">ReproPilot</text>
  </g>
  <text x="270" y="24" class="tiny muted">Research workspace</text>
  <text x="270" y="47" class="title">Bounded AutoResearch · exact revision</text>
  <circle cx="1056" cy="31" r="4" class="check"/>
  <text x="1067" y="36" class="small" fill="#537c62">Completed</text>
  <rect x="1135" y="15" width="44" height="32" rx="7" fill="#b8683e"/>
  <text x="1149" y="36" class="small" fill="#fff">8/8</text>

  <text x="18" y="94" class="label">RESEARCH</text>
  <text x="18" y="115" class="tiny muted">Sessions and source context</text>
  <rect x="14" y="137" width="216" height="62" rx="9" fill="#ede7df"/>
  <text x="27" y="160" class="label">AutoResearch verification</text>
  <text x="27" y="181" class="tiny muted">4 attachments · completed</text>
  <line x1="14" y1="219" x2="230" y2="219" stroke="#ded7cf"/>
  <text x="18" y="247" class="label">CONVERSATION</text>
  <circle cx="30" cy="280" r="13" fill="#f0ddd1"/>
  <text x="26" y="285" class="small accent">R</text>
  <text x="51" y="276" class="label">ReproPilot</text>
  <text x="51" y="295" class="tiny muted">Research response</text>
  <text x="20" y="330" class="small">Pinned revision and frozen</text>
  <text x="20" y="350" class="small">evaluation contract accepted.</text>
  <rect x="18" y="376" width="196" height="31" rx="15" fill="#f4e5dc"/>
  <text x="31" y="396" class="tiny accent">candidate.py · editable</text>
  <rect x="18" y="416" width="196" height="31" rx="15" fill="#e9eee9"/>
  <text x="31" y="436" class="tiny" fill="#537c62">2 evaluators · protected</text>
  <rect x="18" y="456" width="196" height="31" rx="15" fill="#eee9e3"/>
  <text x="31" y="476" class="tiny muted">autoresearch.spec/v1</text>
  <rect x="14" y="581" width="216" height="72" rx="10" fill="#fffdf9" stroke="#ded7cf"/>
  <text x="27" y="605" class="tiny muted">Evidence boundary</text>
  <text x="27" y="625" class="tiny">Model proposes; Python runtime</text>
  <text x="27" y="642" class="tiny">owns write, score and acceptance.</text>

  <text x="270" y="94" class="title">Workflow</text>
  <text x="270" y="114" class="tiny muted">Coder · Research Coding · Sandbox</text>

