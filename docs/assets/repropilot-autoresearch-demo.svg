  <g id="phase1">
    <animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;.27;.33;.60;.94;1" dur="15s" repeatCount="indefinite"/>
    <rect x="692" y="369" width="358" height="118" rx="11" fill="#fffdf9" stroke="#ddd4cd" filter="url(#shadow)"/>
    <text x="714" y="399" class="label">8/8 nodes completed</text>
    <text x="714" y="425" class="small muted">Explicit Agent roles · typed Artifact handoff</text>
    <rect x="714" y="445" width="310" height="8" rx="4" fill="#e7e1da"/>
    <rect x="714" y="445" width="310" height="8" rx="4" fill="#537c62"/>
    <text x="714" y="473" class="tiny muted">Exact revision · isolated runtime · about 26 seconds</text>
  </g>

  <g id="phase2" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.27;.33;.60;.66;1" dur="15s" repeatCount="indefinite"/>
