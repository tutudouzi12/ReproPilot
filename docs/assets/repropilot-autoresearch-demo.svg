    <path class="edge" d="M618 174 H660"/>
    <path class="edge" d="M811 174 H853"/>
    <path class="edge" d="M928 211 V252 H811"/>
    <path class="edge" d="M660 289 H618"/>
    <path class="edge" d="M467 289 H425"/>
    <path class="edge" d="M350 326 V378 H467"/>

    <g transform="translate(275 137)">
      <rect class="node" width="150" height="74" rx="8"/>
      <circle cx="18" cy="18" r="8" fill="#e7ddd6"/>
      <text x="35" y="22" class="tiny muted">CODER</text>
      <text x="13" y="46" class="label">Verify repository</text>
      <circle cx="132" cy="58" r="7" class="check"/><path d="m128 58 3 3 5-6" fill="none" stroke="#fff" stroke-width="1.5"/>
    </g>
    <g transform="translate(468 137)">
      <rect class="node" width="150" height="74" rx="8"/>
      <circle cx="18" cy="18" r="8" fill="#e7ddd6"/>
      <text x="35" y="22" class="tiny muted">CODER</text>
      <text x="13" y="46" class="label">Exact checkout</text>
      <circle cx="132" cy="58" r="7" class="check"/><path d="m128 58 3 3 5-6" fill="none" stroke="#fff" stroke-width="1.5"/>
    </g>
    <g transform="translate(661 137)">
      <rect class="node" width="150" height="74" rx="8"/>
      <circle cx="18" cy="18" r="8" fill="#f0ddd1"/>
      <text x="35" y="22" class="tiny accent">RESEARCH CODING</text>
      <text x="13" y="46" class="label">Freeze ResearchSpec</text>
      <circle cx="132" cy="58" r="7" class="check"/><path d="m128 58 3 3 5-6" fill="none" stroke="#fff" stroke-width="1.5"/>
    </g>
    <g transform="translate(854 137)">
