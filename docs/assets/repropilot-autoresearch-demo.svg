      <circle cx="132" cy="58" r="7" class="check"/><path d="m128 58 3 3 5-6" fill="none" stroke="#fff" stroke-width="1.5"/>
    </g>
    <g transform="translate(468 252)">
      <rect class="node" width="150" height="74" rx="8"/>
      <circle cx="18" cy="18" r="8" fill="#e0e8ec"/>
      <text x="35" y="22" class="tiny" fill="#547384">SANDBOX</text>
